<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 496" width="1000" height="496" role="img" aria-labelledby="tg dg">
  <title id="tg">Contesto consumato prima del primo messaggio dell'utente</title>
  <desc id="dg">Confronto dell'overhead fisso di contesto — system prompt più definizioni dei tool — fra questo harness e altri agenti a riga di comando: Claude Code 29.061 token, questo harness 13.184, GitHub Copilot CLI 12.956, Cline 12.465, Codex CLI 8.497, OpenCode 7.000, il motore pi nudo 1.000. Le cifre per questo harness sono misure reali dell'usage del provider; quelle degli altri provengono da misure pubblicate, citate in docs. Valori in token, scala lineare da zero a 30.000.</desc>

  <rect x="4" y="4" width="992" height="488" rx="18" fill="#0d1420" stroke="#1e2a3d" stroke-width="2"/>

  <text x="32" y="44" font-family="system-ui,Segoe UI,sans-serif" font-size="17" fill="#eef2f9" font-weight="700">Quanto contesto si paga prima di scrivere la prima parola</text>
  <text x="32" y="66" font-family="system-ui,sans-serif" font-size="12" fill="#8b97ac">token inviati al modello a inizio sessione: system prompt + definizioni dei tool</text>

