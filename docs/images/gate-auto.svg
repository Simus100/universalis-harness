<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-label="Come decide il gate automatico dei subagent">
  <title>Gate automatico dei tool: i subagent entrano nel turno solo se servono</title>
  <desc>Schema di flusso. La richiesta dell'utente entra in due controlli: se annuncia una ricognizione (esplora, mappa, audit, analizza, leggi tutti) oppure se il turno precedente ha fatto almeno 5 letture o 20.000 caratteri di risultati. Se una delle due condizioni e' vera i due tool entrano nella lista per quel turno (piu' 5.685 token di schemi) e la decisione viene scritta in chat con motivo e numeri. Altrimenti i tool restano fuori e costano zero.</desc>

  <rect x="4" y="4" width="992" height="452" rx="18" fill="#0d1420" stroke="#1e2a3d" stroke-width="2"/>
  <text x="32" y="46" font-family="system-ui,Segoe UI,sans-serif" font-size="19" fill="#eef2f9" font-weight="700">Il gate decide prima che il turno parta, e lo dice in chat</text>
  <text x="32" y="70" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#8b97ac">il set di tool e' congelato per tutto il turno: nessun cambio a meta' strada, nessuna cache buttata</text>
  <rect x="40" y="180" width="150" height="86" rx="12" fill="#101a28" stroke="#8b5cff" stroke-width="2"/>
  <text x="115.0" y="206" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b5cff" font-weight="700">richiesta</text>
  <text x="115.0" y="228" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" fill="#c6cfdd">messaggio</text>
  <text x="115.0" y="246" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" fill="#c6cfdd">dell'utente</text>
  <rect x="250" y="120" width="270" height="104" rx="12" fill="#101a28" stroke="#38bdf8" stroke-width="2"/>
  <text x="385.0" y="146" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#38bdf8" font-weight="700">1 · ricognizione annunciata?</text>
  <text x="385.0" y="168" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" fill="#c6cfdd">esplora · mappa · audit · analizza</text>
  <text x="385.0" y="186" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" fill="#c6cfdd">leggi tutti · fai il punto</text>
  <rect x="250" y="282" width="270" height="104" rx="12" fill="#101a28" stroke="#38bdf8" stroke-width="2"/>
  <text x="385.0" y="308" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#38bdf8" font-weight="700">2 · turno precedente pesante?</text>
  <text x="385.0" y="330" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" fill="#c6cfdd">almeno 5 letture</text>
  <text x="385.0" y="348" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" fill="#c6cfdd">oppure 20.000 caratteri</text>
  <rect x="620" y="60" width="340" height="130" rx="12" fill="#0f2019" stroke="#34d399" stroke-width="2"/>
  <text x="790.0" y="86" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#34d399" font-weight="700">SUBAGENT ON (solo questo turno)</text>
  <text x="790.0" y="108" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" fill="#c6cfdd">+5.685 token di schemi (in cache)</text>
  <text x="790.0" y="126" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" fill="#c6cfdd">in chat: motivo, letture, prezzo</text>
  <text x="790.0" y="144" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" fill="#c6cfdd">il padre riceve una sintesi, non le letture</text>
  <rect x="620" y="300" width="340" height="110" rx="12" fill="#141a24" stroke="#8b97ac" stroke-width="2"/>
  <text x="790.0" y="326" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b97ac" font-weight="700">SUBAGENT fuori dalla lista</text>
  <text x="790.0" y="348" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" fill="#c6cfdd">0 token di schemi</text>
  <text x="790.0" y="366" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" fill="#c6cfdd">il modello legge da solo</text>
  <text x="790.0" y="384" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" fill="#c6cfdd">nessun costo fisso</text>
  <line x1="190" y1="223" x2="235" y2="187" stroke="#5b9dff" stroke-width="2"/>
  <polygon points="244,180 232,183 239,191" fill="#5b9dff"/>
  <line x1="520" y1="172" x2="604" y2="130" stroke="#34d399" stroke-width="2"/>
  <polygon points="614,125 602,125 606,134" fill="#34d399"/>
  <text x="548" y="132" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#34d399" font-weight="700">sì</text>
  <line x1="385" y1="224" x2="385" y2="267" stroke="#fb7185" stroke-width="2"/>
  <polygon points="385,278 390,267 380,267" fill="#fb7185"/>
  <text x="394" y="256" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#fb7185" font-weight="700">no</text>
  <line x1="520" y1="334" x2="603" y2="339" stroke="#34d399" stroke-width="2"/>
  <polygon points="614,340 603,334 603,344" fill="#34d399"/>
  <text x="548" y="328" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#34d399" font-weight="700">sì</text>
  <text x="32" y="424" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#6f7d92">Le due soglie sono dichiarate nel codice (SUBAGENT_AUTO) e nel manuale: 5 letture, 20.000 caratteri. La modalita' si cambia con /subagent auto|on|off.</text>
</svg>
