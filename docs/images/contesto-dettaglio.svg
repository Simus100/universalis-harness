<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-labelledby="tc dc">
  <title id="tc">Da dove vengono i token che si pagano a ogni turno</title>
  <desc id="dc">Scomposizione dei 12.495 token di contesto a riposo misurati localmente: 6.112 di system prompt, di cui 1.681 note dell'istanza e 4.430 indice delle skill, e 6.383 di definizioni dei tool, di cui 3.112 ricerca web, 1.064 memoria, 943 domande all'utente, 589 browser e 673 nucleo. I tool subagent e bg_wait, spenti di default, aggiungerebbero altri 5.543 token. Scala lineare, valori in token.</desc>

  <rect x="4" y="4" width="992" height="332" rx="18" fill="#0d1420" stroke="#1e2a3d" stroke-width="2"/>
  <text x="32" y="42" font-family="system-ui,Segoe UI,sans-serif" font-size="16" fill="#eef2f9" font-weight="700">Da dove vengono i token che si pagano a ogni turno</text>
  <text x="32" y="62" font-family="system-ui,sans-serif" font-size="11.5" fill="#8b97ac">misura locale, tiktoken o200k_base · 14 tool attivi · 12.495 token totali</text>

  <!-- barra 1: system prompt -->
  <text x="32" y="106" font-family="system-ui,sans-serif" font-size="12" fill="#c6cfdd">system prompt</text>
  <text x="32" y="122" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#8b97ac">6.112</text>
  <rect x="200" y="90" width="184" height="30" rx="3" fill="#8b5cff"/>
  <rect x="384" y="90" width="486" height="30" rx="3" fill="#5b9dff"/>
  <text x="292" y="110" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#0d1420" font-weight="600">note 1.681</text>
  <text x="627" y="110" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#08111f" font-weight="600">indice delle 27 skill 4.430</text>

  <!-- barra 2: tool -->
  <text x="32" y="166" font-family="system-ui,sans-serif" font-size="12" fill="#c6cfdd">definizioni dei tool</text>
  <text x="32" y="182" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#8b97ac">6.383</text>
  <rect x="200" y="150" width="74" height="30" rx="3" fill="#34d399"/>
  <rect x="274" y="150" width="341" height="30" rx="3" fill="#38bdf8"/>
  <rect x="615" y="150" width="117" height="30" rx="3" fill="#fbbf24"/>
  <rect x="732" y="150" width="65" height="30" rx="3" fill="#8b97ac"/>
  <rect x="797" y="150" width="103" height="30" rx="3" fill="#fb7185"/>
  <text x="444" y="170" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#08111f" font-weight="600">ricerca web 3.112</text>
  <text x="673" y="170" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#08111f" font-weight="600">memoria 1.064</text>
  <text x="848" y="170" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#08111f" font-weight="600">ask 943</text>

  <!-- legenda piccoli -->
  <rect x="200" y="204" width="10" height="10" rx="2" fill="#34d399"/>
  <text x="216" y="213" font-family="system-ui,sans-serif" font-size="10.5" fill="#8b97ac">nucleo 673 (read, bash, edit, write)</text>
  <rect x="440" y="204" width="10" height="10" rx="2" fill="#8b97ac"/>
  <text x="456" y="213" font-family="system-ui,sans-serif" font-size="10.5" fill="#8b97ac">browser 589</text>

  <line x1="32" y1="236" x2="968" y2="236" stroke="#243149" stroke-width="1"/>

  <text x="32" y="262" font-family="system-ui,sans-serif" font-size="12" fill="#eef2f9" font-weight="600">Spenti di default, e per questo non pagati</text>
  <text x="32" y="282" font-family="system-ui,sans-serif" font-size="11.5" fill="#8b97ac">subagent + bg_wait: 5.543 token che il modello riceve solo se li accendi — il gate dei tool decide a ogni richiesta.</text>
  <text x="32" y="304" font-family="system-ui,sans-serif" font-size="11.5" fill="#8b97ac">La stessa disciplina vale per browser live, Decision_M e Timestral: il costo in contesto e in RAM lo paga solo il turno che li usa.</text>
  <text x="32" y="324" font-family="system-ui,sans-serif" font-size="10.5" fill="#8b97ac">Fonte: media/overhead-contesto-harness.json · dettaglio per voce e serie storica su 41 sessioni.</text>
