<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" role="img" aria-label="Architettura di Universalis Harness">
  <title>Architettura di Universalis Harness</title>
  <desc>Il browser raggiunge Caddy in HTTPS, che inoltra alla dashboard Node; la dashboard serve interfaccia e API, e lo stream di eventi verso il browser. La dashboard pilota l'agente pi con le sue estensioni (ricerca web, subagent, browser) e legge e scrive i file dell'istanza: sessioni, obiettivi, pianificazioni, skill, artefatti. systemd tiene attivo il servizio e fa i backup. Non c'e' nessun database: lo stato e' in file leggibili. Schema non in scala.</desc>

  <rect x="6" y="6" width="928" height="418" rx="16" fill="#0d1420" stroke="#1e2a3d" stroke-width="2"/>

  <rect x="30" y="40" width="210" height="70" rx="10" fill="#172033" stroke="#5b9dff" stroke-width="2"/>
  <text x="135" y="70" text-anchor="middle" font-size="15" fill="#eef2f9">Browser</text>
  <text x="135" y="90" text-anchor="middle" font-size="12" fill="#8b97ac">desktop · mobile · PWA</text>

  <rect x="300" y="40" width="180" height="70" rx="10" fill="#172033" stroke="#5b9dff" stroke-width="2"/>
  <text x="390" y="70" text-anchor="middle" font-size="15" fill="#eef2f9">Caddy</text>
  <text x="390" y="90" text-anchor="middle" font-size="12" fill="#8b97ac">HTTPS · proxy</text>

  <rect x="540" y="30" width="370" height="90" rx="10" fill="#172033" stroke="#5b9dff" stroke-width="2"/>
  <text x="725" y="60" text-anchor="middle" font-size="15" fill="#eef2f9">Dashboard Node</text>
  <text x="725" y="80" text-anchor="middle" font-size="12" fill="#8b97ac">un solo processo: interfaccia, API, stream di eventi</text>
  <text x="725" y="100" text-anchor="middle" font-size="12" fill="#8b97ac">nessuna build, nessun framework</text>

  <polygon points="242,75 262,67 262,83" fill="#8b97ac"/>
  <text x="252" y="54" text-anchor="middle" font-size="11" fill="#8b97ac">https</text>
  <polygon points="482,75 502,67 502,83" fill="#8b97ac"/>
  <polygon points="502,90 482,82 482,98" fill="#8b97ac"/>

  <rect x="540" y="165" width="370" height="85" rx="10" fill="#172033" stroke="#8b5cff" stroke-width="2"/>
  <text x="725" y="192" text-anchor="middle" font-size="15" fill="#eef2f9">Agente pi + estensioni</text>
  <text x="725" y="212" text-anchor="middle" font-size="12" fill="#8b97ac">ricerca web · subagent · browser reale (sandbox)</text>
  <text x="725" y="232" text-anchor="middle" font-size="12" fill="#8b97ac">strumenti sempre visibili in chat, con esito</text>

  <line x1="725" y1="120" x2="725" y2="160" stroke="#8b97ac" stroke-width="2"/>
  <polygon points="725,163 717,147 733,147" fill="#8b97ac"/>
  <text x="790" y="145" font-size="11" fill="#8b97ac">prompt e tool</text>

  <rect x="540" y="290" width="370" height="95" rx="10" fill="#172033" stroke="#34d399" stroke-width="2"/>
  <text x="725" y="316" text-anchor="middle" font-size="15" fill="#eef2f9">File dell'istanza</text>
  <text x="725" y="336" text-anchor="middle" font-size="12" fill="#8b97ac">chat · obiettivi · pianificazioni · skill</text>
  <text x="725" y="356" text-anchor="middle" font-size="12" fill="#8b97ac">documenti e artefatti prodotti dal lavoro</text>

  <line x1="725" y1="250" x2="725" y2="285" stroke="#8b97ac" stroke-width="2"/>
  <polygon points="725,288 717,272 733,272" fill="#8b97ac"/>
  <text x="790" y="272" font-size="11" fill="#8b97ac">legge e scrive</text>

  <rect x="30" y="290" width="450" height="95" rx="10" fill="#172033" stroke="#fbbf24" stroke-width="2"/>
  <text x="255" y="316" text-anchor="middle" font-size="15" fill="#eef2f9">Linux + systemd</text>
  <text x="255" y="336" text-anchor="middle" font-size="12" fill="#8b97ac">servizio sempre attivo, riparte da solo</text>
  <text x="255" y="356" text-anchor="middle" font-size="12" fill="#8b97ac">backup giornaliero con retention</text>

  <text x="470" y="412" text-anchor="middle" font-size="12" fill="#8b97ac">Nessun database: lo stato è in file leggibili e ispezionabili</text>
</svg>
