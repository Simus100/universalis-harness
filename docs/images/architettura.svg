  <text x="556" y="458" font-family="system-ui,sans-serif" font-size="13" fill="#eef2f9" font-weight="600">File dell'istanza</text>
  <text x="556" y="480" font-family="system-ui,sans-serif" font-size="11" fill="#8b97ac">chat · goal · cron</text>
  <text x="556" y="498" font-family="system-ui,sans-serif" font-size="11" fill="#8b97ac">skill · artefatti</text>
  <text x="556" y="526" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#34d399">JSONL · MD · JSON</text>
  <text x="556" y="556" font-family="system-ui,sans-serif" font-size="10" fill="#8b97ac">niente database</text>

  <rect x="704" y="432" width="150" height="150" rx="12" fill="#172033" stroke="#fbbf24" stroke-width="2"/>
  <text x="720" y="458" font-family="system-ui,sans-serif" font-size="13" fill="#eef2f9" font-weight="600">Servizi locali</text>
