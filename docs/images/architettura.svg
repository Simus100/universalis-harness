  <text x="562" y="70" font-family="system-ui,Segoe UI,sans-serif" font-size="17" fill="#eef2f9" font-weight="700">Dashboard Node</text>
  <text x="562" y="92" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#8b97ac">un solo processo · nessuna build · nessun framework</text>
  <rect x="562" y="106" width="186" height="44" rx="8" fill="#0f1a2b" stroke="#243149" stroke-width="1.5"/>
  <text x="576" y="124" font-family="system-ui,sans-serif" font-size="12" fill="#eef2f9">interfaccia</text>
  <text x="576" y="141" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#8b97ac">dashboard.html</text>
