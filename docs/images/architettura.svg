<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-labelledby="titolo arch">
  <title id="titolo">Architettura di Universalis Harness</title>
  <desc id="arch">Il browser (desktop, telefono, PWA) raggiunge Caddy in HTTPS, che inoltra alla dashboard Node: un solo processo che serve interfaccia, API e lo stream di eventi SSE senza comprimerlo. La dashboard pilota l'agente pi, che parla con il modello e chiama i tool: file dell'istanza, servizi locali (piper per la voce, Decision_M, Timestral) e servizi esterni (ricerca web, Chrome in sandbox, API social). systemd tiene su il processo e i timer di backup e sincronizzazione. Non c'è nessun database: lo stato è in file leggibili. Schema non in scala.</desc>

  <rect x="4" y="4" width="992" height="612" rx="18" fill="#0d1420" stroke="#1e2a3d" stroke-width="2"/>

  <!-- fascia browser / rete -->
  <text x="40" y="42" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#8b97ac" letter-spacing="1.2">CLIENT</text>

  <rect x="36" y="56" width="220" height="104" rx="12" fill="#172033" stroke="#5b9dff" stroke-width="2"/>
  <text x="56" y="88" font-family="system-ui,Segoe UI,sans-serif" font-size="16" fill="#eef2f9" font-weight="600">Browser</text>
  <text x="56" y="112" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#8b97ac">desktop · telefono · PWA</text>
  <text x="56" y="134" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#5b9dff">fetch · EventSource</text>

  <polygon points="276,108 296,100 296,116" fill="#8b97ac"/>
  <line x1="258" y1="108" x2="292" y2="108" stroke="#8b97ac" stroke-width="2"/>
  <text x="266" y="96" font-family="system-ui,sans-serif" font-size="10" fill="#8b97ac">https</text>

  <rect x="300" y="56" width="180" height="104" rx="12" fill="#172033" stroke="#5b9dff" stroke-width="2"/>
  <text x="320" y="88" font-family="system-ui,Segoe UI,sans-serif" font-size="16" fill="#eef2f9" font-weight="600">Caddy</text>
  <text x="320" y="112" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#8b97ac">TLS · reverse proxy</text>
  <text x="320" y="134" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#8b97ac">SSE senza compressione</text>

  <polygon points="516,108 536,100 536,116" fill="#8b97ac"/>
  <line x1="498" y1="108" x2="532" y2="108" stroke="#8b97ac" stroke-width="2"/>
