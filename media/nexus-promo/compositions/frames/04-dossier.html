          const tl = gsap.timeline({ paused: true });

          tl.to("#f04-dato", { opacity: 0, x: 26, duration: 0.4, ease: "power2.in" }, 2.05);

          tl.fromTo("#f04-scen", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 4.9);

          window.__timelines["04-dossier"] = tl;
          tl.seek(0);
        })();
