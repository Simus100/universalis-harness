<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Modelli · Meta — Muse Wonder: memoria e perseveranza</title>
  <desc>Card per un post di Aion · AI News: categoria in alto, titolo grande, marchio in basso.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b13"/>
      <stop offset="0.6" stop-color="#060810"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.16" cy="0.34" r="0.75">
      <stop offset="0" stop-color="#8b5cff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
<linearGradient id="markTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bcd8ff"/><stop offset="1" stop-color="#6f9fe8"/>
    </linearGradient>
    <linearGradient id="markBot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8168e6"/><stop offset="1" stop-color="#6b52d8"/>
    </linearGradient>
    <pattern id="dots" width="38" height="38" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#141d2c"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)" opacity="0.5"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g transform="translate(93,104) scale(0.05555555555555555) translate(-512,-520)">
    <defs>
      <clipPath id="cm-t"><polygon points="-800,-900 1700,-900 1700,1697 -800,-803"/></clipPath>
      <clipPath id="cm-b"><polygon points="-800,-781 1700,1719 1700,1900 -800,1900"/></clipPath>
    </defs>
    <g clip-path="url(#cm-t)"><path fill="url(#markTop)" fill-rule="evenodd" d="M466,250 L558,250 L810,790 L720,790 L664.2,664 L359.8,664 L304,790 L214,790 Z M512,320 L626.2,578 L397.8,578 Z"/></g>
    <g clip-path="url(#cm-b)"><path fill="url(#markBot)" fill-rule="evenodd" d="M466,250 L558,250 L810,790 L720,790 L664.2,664 L359.8,664 L304,790 L214,790 Z M512,320 L626.2,578 L397.8,578 Z"/></g>
