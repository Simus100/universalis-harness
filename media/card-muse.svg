  <text x="124" y="110" font-family="DejaVu Sans" font-size="16" letter-spacing="6" fill="#8ea2bf">AION · AI NEWS</text>
  <text x="116" y="223" font-family="DejaVu Sans" font-size="19" letter-spacing="4" fill="#8b5cff">MODELLI · META</text>
