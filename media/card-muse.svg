    <text x="116" y="419" font-size="68" font-weight="bold" fill="#f6f9ff">e perseveranza</text>
  </g>
  <line x1="80" y1="502" x2="1120" y2="502" stroke="#151d2b" stroke-width="2"/>
  <text x="116" y="548" font-family="DejaVu Sans" font-size="17" letter-spacing="3" fill="#6c80a0">Cosa è successo · perché conta · cosa puoi farci</text>
