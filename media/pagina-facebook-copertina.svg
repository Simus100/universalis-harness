<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="624" viewBox="0 0 1640 624">
  <title>Universalis Harness — copertina della Pagina</title>
  <desc>Copertina scura con il marchio a grafo a sinistra e il nome del progetto, la descrizione breve e la dichiarazione di trasparenza sulla gestione assistita da un agente AI.</desc>
  <rect width="1640" height="624" fill="#07080b"/>
  <rect x="0" y="0" width="1640" height="8" fill="#5b9dff"/>
  <g transform="translate(196,312)">
    <g stroke="#2b3240" stroke-width="11" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-152"/>
      <line x1="0" y1="0" x2="132" y2="-76"/>
      <line x1="0" y1="0" x2="132" y2="76"/>
      <line x1="0" y1="0" x2="0" y2="152"/>
      <line x1="0" y1="0" x2="-132" y2="76"/>
      <line x1="0" y1="0" x2="-132" y2="-76"/>
    </g>
    <circle cx="0" cy="0" r="74" fill="#5b9dff"/>
    <circle cx="0" cy="0" r="34" fill="#07080b"/>
    <g fill="#8b5cff">
      <circle cx="0" cy="-152" r="30"/>
      <circle cx="132" cy="-76" r="30"/>
      <circle cx="132" cy="76" r="30"/>
    </g>
    <g fill="#34d399">
      <circle cx="0" cy="152" r="30"/>
      <circle cx="-132" cy="76" r="30"/>
    </g>
    <circle cx="-132" cy="-76" r="30" fill="#fbbf24"/>
  </g>
  <g font-family="DejaVu Sans" text-anchor="start">
    <text x="470" y="252" font-size="94" font-weight="bold" fill="#eef2f9">Universalis Harness</text>
    <text x="470" y="330" font-size="38" fill="#c6cfdd">Un agente AI che lavora sui tuoi file, non solo in una chat.</text>
    <text x="470" y="392" font-size="34" fill="#a3adc0">Dashboard self-hosted · memoria · obiettivi · browser pilotato</text>
    <text x="470" y="470" font-size="30" fill="#5b9dff">Pagina gestita con l'assistenza di Aion, l'agente AI</text>
  </g>
</svg>
