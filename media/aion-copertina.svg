<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="624" viewBox="0 0 1640 624">
  <title>Aion · AI News — copertina</title>
  <desc>Copertina 1640x624. Nella fascia centrale sicura per il mobile stanno il nome della testata, il titolo «L'AI spiegata in tre righe» e la riga «Cosa succede, perché conta, cosa puoi farci». Ai lati, nodi di rete e le parole chiave del tema.</desc>
