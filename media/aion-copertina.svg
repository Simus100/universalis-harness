    <radialGradient id="cglow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#5b9dff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1640" height="624" fill="url(#cbg)"/>
  <ellipse cx="820" cy="312" rx="640" ry="300" fill="url(#cglow)"/>
